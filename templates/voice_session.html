<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage - Senior Living Consultant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        :root {
            --primary-color: #0d9488; /* teal-600 */
            --primary-hover: #0f766e; /* teal-700 */
            --bg-color: #f8fafc; /* slate-50 */
            --text-main: #0f172a; /* slate-900 */
            --text-muted: #64748b; /* slate-500 */
            --error-bg: #fef2f2; /* red-50 */
            --error-text: #dc2626; /* red-600 */
            --success-color: #22c55e; /* green-500 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2.5rem;
            height: 2.5rem;
            background-color: var(--primary-color);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid #e2e8f0;
        }

        .status-dot {
            width: 0.625rem;
            height: 0.625rem;
            background-color: #cbd5e1;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
            animation: pulse 2s infinite;
        }

        .status-text {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Main Content */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Background Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(64px);
            opacity: 0.6;
            animation: blob-bounce 10s infinite ease-in-out;
            z-index: 0;
        }

        .blob-1 {
            top: 20%;
            left: 20%;
            width: 24rem;
            height: 24rem;
            background-color: #ccfbf1; /* teal-100 */
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: 20%;
            right: 20%;
            width: 24rem;
            height: 24rem;
            background-color: #d1fae5; /* emerald-100 */
            animation-delay: 2s;
        }

        .blob-3 {
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20rem;
            height: 20rem;
            background-color: #e0e7ff; /* sky-100 */
            animation-delay: 4s;
        }

        @keyframes blob-bounce {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Interface Card */
        .interface-card {
            position: relative;
            width: 100%;
            max-width: 32rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            z-index: 1;
        }

        .status-message {
            text-align: center;
        }

        .status-message h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .status-message p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Visualizer - Enhanced Globe Animation */
        .visualizer-container {
            width: 16rem;
            height: 16rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #visualizer-canvas {
            width: 100%;
            height: 100%;
            max-width: 400px;
            max-height: 400px;
        }

        .fallback-icon {
            position: absolute;
            width: 8rem;
            height: 8rem;
            background: #f0fdfa;
            border: 4px solid #ccfbf1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5eead4;
        }

        .fallback-icon svg {
            width: 3rem;
            height: 3rem;
        }

        /* Controls */
        .controls {
            width: 100%;
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(13, 148, 136, 0.3);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-danger {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #fecaca;
        }

        .btn-danger:hover {
            background-color: #fee2e2;
        }

        .footer-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Recommendations Panel (Slide up) */
        .recommendations-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
            max-height: 70vh;
            overflow-y: auto;
        }

        .recommendations-overlay.active {
            transform: translateY(0);
        }

        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .rec-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .rec-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1rem;
            transition: transform 0.2s;
        }
        
        .rec-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .rec-badge {
            background: #f0f9ff;
            color: #0369a1;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        /* Dark mode support overrides if system preference is dark */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
            }
            
            .interface-card {
                background: rgba(30, 41, 59, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
            }
            
            header {
                background: rgba(15, 23, 42, 0.8);
                border-bottom-color: #334155;
            }
            
            .status-badge {
                background: #1e293b;
                border-color: #334155;
            }
            
            .blob {
                opacity: 0.3;
            }
            
            .blob-1 { background-color: #115e59; }
            .blob-2 { background-color: #065f46; }
            .blob-3 { background-color: #1e40af; }
            
            .recommendations-overlay {
                background: rgba(15, 23, 42, 0.95);
                color: white;
            }
            
            .rec-card {
                background: #1e293b;
                border-color: #334155;
            }
        }
    </style>
</head>
<body>
    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header>
        <div class="brand">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>Sage</h1>
                <p>Senior Living Consultant</p>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-text" id="status-text">Offline</span>
        </div>
    </header>

    <main>
        <div class="interface-card">
            <div class="status-message">
                <h2 id="main-status">How can I help you today?</h2>
                <p id="sub-status">Connect to start a voice consultation.</p>
            </div>

            <div class="visualizer-container">
                <canvas id="visualizer-canvas" width="400" height="400"></canvas>
                
                <div class="fallback-icon" id="fallback-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
            </div>

            <div class="controls">
                <button id="btn-connect" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    Start Consultation
                </button>
                <button id="btn-disconnect" class="btn btn-danger" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
                        <line x1="23" y1="1" x2="1" y2="23"/>
                    </svg>
                    End Session
                </button>
            </div>

            <div class="footer-info">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Secure & Private • Powered by Gemini Live</span>
            </div>
        </div>
    </main>

    <!-- Recommendations Overlay -->
    <div class="recommendations-overlay" id="recommendations-panel">
        <div class="rec-header">
            <h3 style="font-size: 1.25rem; font-weight: 600;">Top Recommendations</h3>
            <button class="btn btn-danger" style="width: auto; padding: 0.5rem 1rem; font-size: 0.875rem;" onclick="document.getElementById('recommendations-panel').classList.remove('active')">
                Close
            </button>
        </div>
        <div class="rec-grid" id="recommendations-list">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIG & STATE
        // ==========================================
        const SESSION_ID = '{{ session_id }}';
        const OUTPUT_SAMPLE_RATE = 24000;
        
        let socket = null;
        let isConnected = false;
        
        // Audio Contexts
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;
        let nextStartTime = 0;
        
        // Input
        let mediaStream = null;
        let inputContext = null;
        let scriptProcessor = null;
        
        // Visualization State
        let inputVolume = 0;
        let outputVolume = 0;
        let outputAnalyser = null;
        
        // UI Elements
        const btnConnect = document.getElementById('btn-connect');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const mainStatus = document.getElementById('main-status');
        const subStatus = document.getElementById('sub-status');
        const fallbackIcon = document.getElementById('fallback-icon');
        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // VISUALIZER LOGIC (Ported from React)
        // ==========================================
        let animationFrame = null;
        let time = 0;

        function startVisualizer() {
            fallbackIcon.style.display = 'none';
            
            const draw = () => {
                if (!isConnected) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                // Use max volume
                const vol = Math.max(inputVolume, outputVolume);
                const isOutput = outputVolume > inputVolume;

                // Sage Theme Colors (matching reference)
                // Output (Agent speaking): Teal/Green (74, 222, 128)
                // Input (User speaking): Purple/Blue (56, 189, 248)
                const r = isOutput ? 74 : 56;
                const g = isOutput ? 222 : 189;
                const b = isOutput ? 128 : 248;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                // Base radius + volume bump + breathing
                const radius = 60 + (vol * 50) + (Math.sin(time * 0.05) * 5);

                // Draw Glow
                const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, radius * 2);
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.8)`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Draw Core
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 1)`;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();

                // Ripples
                if (vol > 0.1) {
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.5)`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius + (Math.sin(time * 0.2) * 10) + 10, 0, Math.PI * 2);
                    ctx.stroke();
                }

                time++;
                animationFrame = requestAnimationFrame(draw);
            };
            draw();
        }

        function stopVisualizer() {
            cancelAnimationFrame(animationFrame);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fallbackIcon.style.display = 'flex';
        }

        // ==========================================
        // AUDIO HANDLING
        // ==========================================
        
        function initAudioContext() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext({ sampleRate: OUTPUT_SAMPLE_RATE });
            
            // Output Analyser for Visualization
            outputAnalyser = audioContext.createAnalyser();
            outputAnalyser.fftSize = 256;
            outputAnalyser.connect(audioContext.destination); // Connect to speaker
        }

        // Input Handling (Microphone)
        async function startInputStream() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        autoGainControl: true,
                        noiseSuppression: true
                    }
                });

                inputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const source = inputContext.createMediaStreamSource(mediaStream);
                
                // Use ScriptProcessor for data access (compatible with our socket flow)
                scriptProcessor = inputContext.createScriptProcessor(4096, 1, 1);
                
                scriptProcessor.onaudioprocess = (e) => {
                    if (!isConnected) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    
                    // 1. Calculate Input Volume for Visualizer
                    let sum = 0;
                    for (let i = 0; i < inputData.length; i += 10) {
                        sum += Math.abs(inputData[i]);
                    }
                    const avg = sum / (inputData.length / 10);
                    inputVolume = Math.min(1, avg * 5); // Amplify for visuals

                    // 2. Convert to PCM and send to server
                    // We need Int16 for the backend
                    const pcmData = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcmData[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    
                    // Base64 encode
                    const base64Audio = arrayBufferToBase64(pcmData.buffer);
                    
                    // Emit to server
                    if (socket) {
                        socket.emit('voice_input', {
                            session_id: SESSION_ID,
                            audio: base64Audio
                        });
                    }
                };

                source.connect(scriptProcessor);
                scriptProcessor.connect(inputContext.destination);

            } catch (err) {
                console.error("Error starting input stream", err);
                alert("Could not access microphone.");
            }
        }

        function stopInputStream() {
            if (scriptProcessor) scriptProcessor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (inputContext) inputContext.close();
            inputVolume = 0;
        }

        // Output Handling (Playback)
        function queueAudio(base64Data) {
            audioQueue.push(base64Data);
            if (!isPlaying) {
                playNextChunk();
            }
        }

        async function playNextChunk() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                outputVolume = 0;
                return;
            }

            isPlaying = true;
            const base64Data = audioQueue.shift();
            
            try {
                const audioBuffer = base64ToArrayBuffer(base64Data);
                
                // Create buffer
                // Since we know it's 24kHz PCM 16-bit from backend
                const pcmData = new Int16Array(audioBuffer);
                const floatData = new Float32Array(pcmData.length);
                for (let i = 0; i < pcmData.length; i++) {
                    floatData[i] = pcmData[i] / 32768;
                }
                
                const buffer = audioContext.createBuffer(1, floatData.length, OUTPUT_SAMPLE_RATE);
                buffer.copyToChannel(floatData, 0);

                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                
                // Connect to Analyser for Output Volume
                source.connect(outputAnalyser);
                // Analyser is already connected to destination in init
                
                source.onended = () => {
                    playNextChunk();
                };
                
                source.start();
                
                // Update output volume from analyser loop
                updateOutputVolume();

            } catch (e) {
                console.error("Playback error", e);
                playNextChunk();
            }
        }

        function updateOutputVolume() {
            if (!isPlaying) {
                outputVolume = 0;
                return;
            }
            
            const dataArray = new Uint8Array(outputAnalyser.frequencyBinCount);
            outputAnalyser.getByteTimeDomainData(dataArray);
            
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) {
                const v = (dataArray[i] - 128) / 128.0;
                sum += v * v;
            }
            const rms = Math.sqrt(sum / dataArray.length);
            outputVolume = Math.min(1, rms * 5);
            
            requestAnimationFrame(updateOutputVolume);
        }

        // ==========================================
        // CONNECTION & UI LOGIC
        // ==========================================

        function setUIState(state) {
            if (state === 'connected') {
                isConnected = true;
                btnConnect.style.display = 'none';
                btnDisconnect.style.display = 'flex';
                statusDot.classList.add('active');
                statusText.innerText = 'Live';
                mainStatus.innerText = "Listening...";
                subStatus.innerText = "Go ahead, speak naturally.";
                startVisualizer();
            } else if (state === 'disconnected') {
                isConnected = false;
                btnConnect.style.display = 'flex';
                btnDisconnect.style.display = 'none';
                statusDot.classList.remove('active');
                statusText.innerText = 'Offline';
                mainStatus.innerText = "How can I help you today?";
                subStatus.innerText = "Connect to start a voice consultation.";
                stopVisualizer();
                stopInputStream();
            } else if (state === 'connecting') {
                btnConnect.disabled = true;
                btnConnect.innerHTML = '<span class="animate-spin" style="display:inline-block; width:1rem; height:1rem; border:2px solid white; border-top-color:transparent; border-radius:50%;"></span> Connecting...';
            }
        }

        btnConnect.onclick = async () => {
            setUIState('connecting');
            
            // 1. Start Audio Contexts
            initAudioContext();
            await audioContext.resume();
            
            // 2. Start Microphone
            await startInputStream();
            
            // 3. Connect Socket
            socket.emit('join_session', {
                session_id: SESSION_ID,
                client_type: 'client'
            });
        };

        btnDisconnect.onclick = () => {
            socket.emit('stop_voice', { session_id: SESSION_ID });
            setUIState('disconnected');
            btnConnect.disabled = false;
            btnConnect.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg> Start Consultation`;
        };

        // Socket.IO Initialization
        socket = io();

        socket.on('connect', () => {
            console.log("Socket connected");
        });

        socket.on('joined', () => {
            // Start voice agent on server
            socket.emit('start_voice', {
                session_id: SESSION_ID,
                language: 'english'
            });
        });

        socket.on('voice_ready', () => {
            setUIState('connected');
        });

        socket.on('voice_audio', (data) => {
            queueAudio(data.audio);
        });
        
        socket.on('voice_recommendations', (data) => {
            showRecommendations(data.recommendations);
        });

        // Helpers
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }
        
        function showRecommendations(recs) {
            if (!recs || recs.length === 0) {
                console.warn('No recommendations received');
                return;
            }
            
            console.log('Showing recommendations:', recs);
            const panel = document.getElementById('recommendations-panel');
            const list = document.getElementById('recommendations-list');
            
            if (!panel || !list) {
                console.error('Recommendations panel elements not found');
                return;
            }
            
            list.innerHTML = recs.map((rec, idx) => {
                const name = rec.community_name || rec.name || `Community #${rec.community_id || idx + 1}`;
                const score = rec.final_score || rec.score || 0;
                const city = rec.city || 'Location N/A';
                const careLevel = rec.care_level || 'Assisted Living';
                const price = rec.monthly_fee || rec.base_price || 'N/A';
                
                return `
                    <div class="rec-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                            <h4 style="font-weight:600;">${name}</h4>
                            <span class="rec-badge">${Math.round(score * 100)}% Match</span>
                        </div>
                        <p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:0.5rem;">${city} • ${careLevel}</p>
                        <div style="font-weight:600; color:var(--primary-color);">$${typeof price === 'number' ? price.toLocaleString() : price}/mo</div>
                    </div>
                `;
            }).join('');
            
            panel.classList.add('active');
            
            // Also update status message
            if (mainStatus) {
                mainStatus.innerText = "Recommendations Ready!";
                subStatus.innerText = `Found ${recs.length} matching communities`;
            }
        }
    </script>
</body>
</html>
